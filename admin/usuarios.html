<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4A90D9">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NuevaExpress">

<link rel="icon" type="image/jpeg" href="/assets/img/logo.jpg">

<title>Usuarios — Admin NuevaExpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/css/admin.css?v=202610230059">
<style>
.filter-bar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.filter-bar input,.filter-bar select { padding:9px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'Plus Jakarta Sans',system-ui,'Segoe UI',Roboto,sans-serif; font-size:.9rem; outline:none; background:white; }
.filter-bar input { flex:1; min-width:200px; }
.filter-bar input:focus,.filter-bar select:focus { border-color:var(--accent); }
</style>
</head>
<body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo"><img src="/assets/img/logo.jpg" alt="NuevaExpress"><span class="logo-text">Nueva<span>Express</span></span></div>
      <div style="color:rgba(255,255,255,.4);font-size:.75rem;margin-top:4px">Administrador</div>
    </div>
    <ul class="sidebar-nav">
      <li><a href="index.html">📊 Dashboard</a></li>
      <li><a href="negocios.html">🏪 Negocios</a></li>
      <li><a href="usuarios.html" class="active">👥 Usuarios</a></li>
      <li><a href="pedidos.html">📋 Pedidos</a></li>
      <li><a href="#" onclick="APP.logout()">🚪 Salir</a></li>
    </ul>
  </aside>

  <main class="main-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <div class="page-header" style="margin:0"><h1>Usuarios</h1><p>Gestión de cuentas del sistema</p></div>
      <span class="badge badge-accepted" id="totalBadge"></span>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Buscar por nombre, email o teléfono" oninput="filterTable()">
      <select id="roleFilter" onchange="filterTable()">
        <option value="">Todos los roles</option>
        <option value="admin">Admin</option>
        <option value="negocio">Negocio</option>
        <option value="cliente">Cliente</option>
        <option value="repartidor">Repartidor</option>
      </select>
      <select id="statusFilter" onchange="filterTable()">
        <option value="">Todos</option>
        <option value="1">Activos</option>
        <option value="0">Inactivos</option>
      </select>
    </div>

    <div>
    <div class="ad-list" id="usersBody"><div class="ad-empty">Cargando…</div></div>
      <!-- Paginación -->
      <div id="pagination" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 0;margin-top:8px">
        <div id="pageInfo" style="font-size:.85rem;color:var(--muted)"></div>
        <div id="pageButtons" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/app.js?v=202610222210"></script>
<script>
  // Recover token from URL hash if localStorage is empty
  (function() {
    var hash = window.location.hash;
    if (hash && hash.indexOf('tk=') !== -1) {
      var parts = hash.substring(1).split('&');
      var tk = '', us = '';
      parts.forEach(function(p) {
        if (p.indexOf('tk=') === 0) tk = p.substring(3);
        if (p.indexOf('us=') === 0) us = decodeURIComponent(p.substring(3));
      });
      if (tk) {
        localStorage.setItem('nuevaexpress_token', tk);
        if (us) localStorage.setItem('nuevaexpress_user', us);
        // Clean URL
        history.replaceState(null, '', window.location.pathname);
      }
    }
  })();

var adminUser  = JSON.parse(localStorage.getItem('nuevaexpress_user') || '{}');
if (!localStorage.getItem('nuevaexpress_token') || adminUser.role !== 'admin') { window.location.href = '/cliente/login.html'; }
let allUsers = [];
let currentPage = 1;
const PAGE_SIZE = 10;
let currentList = [];

const roleBadge = { admin:'badge-cancel', negocio:'badge-delivery', cliente:'badge-accepted', repartidor:'badge-active' };
const roleLabel = { admin:'Admin', negocio:'Negocio', cliente:'Cliente', repartidor:'Repartidor' };

function adTypeIcon(t){ var p = t==='delivery' ? '<circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>' : t==='dine_in' ? '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>' : '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'; return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
function adTypeLabel(t){ return t==='delivery' ? 'Delivery' : t==='dine_in' ? 'En negocio' : 'Recoger'; }
function adShortDate(s){ try { var d = new Date(String(s).replace(' ','T')); return d.toLocaleString('es-GT',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); } catch(e){ return ''; } }
function adPager(cur, pages, total, fn, noun){
  if (pages <= 1) return total ? '<div class="ad-pg"><span>'+total+' '+noun+'</span></div>' : '';
  var h = '<div class="ad-pg"><button onclick="'+fn+'('+(cur-1)+')" '+(cur===1?'disabled':'')+'>‹</button>';
  for (var i=1;i<=pages;i++){
    if (i===1||i===pages||(i>=cur-1&&i<=cur+1)) h += '<button class="'+(i===cur?'on':'')+'" onclick="'+fn+'('+i+')">'+i+'</button>';
    else if (i===cur-2||i===cur+2) h += '<span>…</span>';
  }
  return h + '<button onclick="'+fn+'('+(cur+1)+')" '+(cur===pages?'disabled':'')+'>›</button><span>'+total+' '+noun+'</span></div>';
}
async function init() {
  const res = await APP.get('/admin/users');
  allUsers = res?.data || [];
  document.getElementById('totalBadge').textContent = allUsers.length + ' usuarios';
  currentPage = 1;
  renderTable(allUsers);
}

function filterTable() {
  const q      = document.getElementById('searchInput').value.toLowerCase();
  const role   = document.getElementById('roleFilter').value;
  const status = document.getElementById('statusFilter').value;
  const filtered = allUsers.filter(u => {
    const mQ = !q || (u.name||'').toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q) || (u.phone||'').includes(q);
    const mR = !role || u.role === role;
    const mS = status === '' || u.is_active == status;
    return mQ && mR && mS;
  });
  currentPage = 1;
  renderTable(filtered);
}

function goPage(page) {
  var totalPages = Math.ceil(currentList.length / PAGE_SIZE);
  if (page < 1 || page > totalPages) return;
  currentPage = page;
  renderTable(currentList);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderTable(list) {
  currentList = list;
  const body = document.getElementById('usersBody');
  if (!list.length) {
    body.innerHTML = '<div class="ad-empty">Sin resultados</div>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  const totalPages = Math.ceil(list.length / PAGE_SIZE);
  currentPage = Math.min(currentPage, totalPages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const end   = Math.min(start + PAGE_SIZE, list.length);
  const page  = list.slice(start, end);

  body.innerHTML = page.map(u => `
    <div class="ad-row" onclick="editUser(${u.id})">
      <div class="ad-av">${APP.esc(String(u.name||'U').trim().charAt(0).toUpperCase())}</div>
      <div class="ad-main">
        <div class="ad-t"><span class="ad-name">${APP.esc(u.name)}</span><span class="ad-st r-${u.role}">${roleLabel[u.role]||u.role}</span></div>
        <div class="ad-s">${APP.esc(u.email)}${u.phone ? ' · <b>'+APP.esc(u.phone)+'</b>' : ''}</div>
        <div class="ad-s">${u.last_login ? 'Último acceso: '+APP.date(u.last_login) : 'Nunca ha ingresado'}</div>
      </div>
      <div class="ad-r">
        <span class="ad-st ${u.is_active?'on':'off'}">${u.is_active?'Activo':'Inactivo'}</span>
        <div class="ad-acts" onclick="event.stopPropagation()">
          <button class="ad-ib" title="Editar" onclick="editUser(${u.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg></button>
          <button class="ad-ib warn" title="${u.is_active?'Desactivar':'Activar'}" onclick="toggleStatus(${u.id}, ${u.is_active})">${u.is_active ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>'}</button>
          <button class="ad-ib danger" title="Eliminar" onclick="deleteUser(${u.id}, '${(u.name||'').replace(/'/g,'')}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
        </div>
      </div>
    </div>
  `).join('');

  // Info y botones de paginación
  document.getElementById('pageInfo').textContent = '';
  document.getElementById('pageButtons').innerHTML = adPager(currentPage, totalPages, list.length, 'goPage', 'usuarios');
  document.getElementById('pagination').style.display = 'block';
}


function editUser(id) {
  window.location.href = 'editar-usuario.html?id=' + id;
}

async function toggleStatus(id, current) {
  var res = await fetch('/api/admin/users/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('nuevaexpress_token') },
    body: JSON.stringify({ is_active: current ? 0 : 1 })
  }).then(function(r){ return r.json(); });
  if (res.success) { APP.toast(current ? 'Usuario desactivado' : 'Usuario activado'); init(); }
  else APP.toast(res.message || 'Error', 'error');
}

async function deleteUser(id, name) {
  if (!confirm('¿Eliminar al usuario "' + name + '"? Esta acción no se puede deshacer.')) return;
  var res = await fetch('/api/admin/users/' + id, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('nuevaexpress_token') }
  }).then(function(r){ return r.json(); });
  if (res.success) { APP.toast('Usuario eliminado'); init(); }
  else APP.toast(res.message || 'Error', 'error');
}

init();
</script>

<script>
function toggleSidebar() {
  var sidebar = document.querySelector('.sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  if (sidebar) sidebar.classList.toggle('open');
  if (overlay) overlay.classList.toggle('open');
}
</script>

<script src="/assets/js/pwa.js?v=202610251300"></script>
</body>
