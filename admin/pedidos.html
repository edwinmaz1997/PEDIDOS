<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4A90D9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NuevaExpress">
<link rel="apple-touch-icon" href="/assets/img/logo.jpg">
<link rel="icon" type="image/jpeg" href="/assets/img/logo.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pedidos — Admin NuevaExpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css?v=202610222210">
<link rel="stylesheet" href="/assets/css/admin.css?v=202610230056">
<style>
.filter-bar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.filter-bar input,.filter-bar select { padding:9px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'Plus Jakarta Sans',system-ui,'Segoe UI',Roboto,sans-serif; font-size:.9rem; outline:none; background:white; }
.filter-bar input { flex:1; min-width:180px; }
.filter-bar input:focus,.filter-bar select:focus { border-color:var(--accent); }
.revenue-bar { display:flex; gap:16px; background:var(--charcoal); border-radius:var(--radius); padding:20px 24px; margin-bottom:24px; flex-wrap:wrap; }
.rev-item { flex:1; min-width:120px; }
.rev-label { font-size:.75rem; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.rev-value { font-family:'Plus Jakarta Sans',system-ui,'Segoe UI',Roboto,sans-serif; font-size:1.4rem; font-weight:700; color:white; }
</style>
</head>
<body>
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo"><img src="/assets/img/logo.jpg" alt="NuevaExpress"><span class="logo-text">Nueva<span>Express</span></span></div>
      <div style="color:rgba(255,255,255,.4);font-size:.75rem;margin-top:4px">Administrador</div>
    </div>
    <ul class="sidebar-nav">
      <li><a href="index.html">📊 Dashboard</a></li>
      <li><a href="negocios.html">🏪 Negocios</a></li>
      <li><a href="usuarios.html">👥 Usuarios</a></li>
      <li><a href="pedidos.html" class="active">📋 Pedidos</a></li>
      <li><a href="#" onclick="APP.logout()">🚪 Salir</a></li>
    </ul>
  </aside>

  <main class="main-content">
    <div class="page-header"><h1>Todos los Pedidos</h1><p>Vista completa del sistema</p></div>

    <div class="revenue-bar" id="revenueBar">
      <div class="rev-item"><div class="rev-label">Total pedidos</div><div class="rev-value" id="rTotal">—</div></div>
      <div class="rev-item"><div class="rev-label">Ingresos tarifas (Q)</div><div class="rev-value" id="rRevenue">—</div></div>
      <div class="rev-item"><div class="rev-label">Deliveries</div><div class="rev-value" id="rDeliveries">—</div></div>
      <div class="rev-item"><div class="rev-label">Pendientes</div><div class="rev-value" id="rPending" style="color:#ffb703">—</div></div>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Buscar por # pedido, cliente, negocio..." oninput="filterTable()">
      <select id="statusFilter" onchange="filterTable()">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendiente</option>
        <option value="aceptado">Aceptado</option>
        <option value="en_preparacion">En preparación</option>
        <option value="listo">Listo</option>
        <option value="en_camino">En camino</option>
        <option value="entregado">Entregado</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <select id="typeFilter" onchange="filterTable()">
        <option value="">Todos los tipos</option>
        <option value="pickup">Recoger</option>
        <option value="delivery">Delivery</option>
        <option value="dine_in">En negocio</option>
      </select>
    </div>

    <div class="ad-list" id="ordersBody"><div class="ad-empty">Cargando…</div></div>
    <div id="pagination"></div>
  </main>
</div>

<script src="../assets/js/app.js?v=202610222210"></script>
<script>
  // Recover token from URL hash if localStorage is empty
  (function() {
    var hash = window.location.hash;
    if (hash && hash.indexOf('tk=') !== -1) {
      var parts = hash.substring(1).split('&');
      var tk = '', us = '';
      parts.forEach(function(p) {
        if (p.indexOf('tk=') === 0) tk = p.substring(3);
        if (p.indexOf('us=') === 0) us = decodeURIComponent(p.substring(3));
      });
      if (tk) {
        localStorage.setItem('nuevaexpress_token', tk);
        if (us) localStorage.setItem('nuevaexpress_user', us);
        // Clean URL
        history.replaceState(null, '', window.location.pathname);
      }
    }
  })();

var adminUser  = JSON.parse(localStorage.getItem('nuevaexpress_user') || '{}');
if (!localStorage.getItem('nuevaexpress_token') || adminUser.role !== 'admin') { window.location.href = '/cliente/login.html'; }
let allOrders = [];

async function init() {
  const res = await APP.get('/admin/orders');
  allOrders = res?.data || [];

  // Compute revenue summary
  const active = allOrders.filter(o => o.status !== 'cancelado');
  const totalRevenue = active.reduce((s, o) => s + parseFloat(o.service_fee||0), 0);
  const totalDelivery = active.filter(o => o.delivery_type === 'delivery').reduce((s,o) => s + parseFloat(o.delivery_fee||0), 0);
  document.getElementById('rTotal').textContent = allOrders.length;
  document.getElementById('rRevenue').textContent = 'Q' + totalRevenue.toFixed(2);
  document.getElementById('rDeliveries').textContent = allOrders.filter(o=>o.delivery_type==='delivery').length;
  document.getElementById('rPending').textContent = allOrders.filter(o=>o.status==='pendiente').length;

  renderTable(allOrders);
}

function filterTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const type   = document.getElementById('typeFilter').value;
  const filtered = allOrders.filter(o => {
    const mQ = !q || (o.order_number||'').toLowerCase().includes(q) || (o.client_name||'').toLowerCase().includes(q) || (o.business_name||'').toLowerCase().includes(q);
    const mS = !status || o.status === status;
    const mT = !type || o.delivery_type === type;
    return mQ && mS && mT;
  });
  renderTable(filtered);
}

function adTypeIcon(t){ var p = t==='delivery' ? '<circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>' : t==='dine_in' ? '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>' : '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'; return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
function adTypeLabel(t){ return t==='delivery' ? 'Delivery' : t==='dine_in' ? 'En negocio' : 'Recoger'; }
function adShortDate(s){ try { var d = new Date(String(s).replace(' ','T')); return d.toLocaleString('es-GT',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); } catch(e){ return ''; } }
function adPager(cur, pages, total, fn, noun){
  if (pages <= 1) return total ? '<div class="ad-pg"><span>'+total+' '+noun+'</span></div>' : '';
  var h = '<div class="ad-pg"><button onclick="'+fn+'('+(cur-1)+')" '+(cur===1?'disabled':'')+'>‹</button>';
  for (var i=1;i<=pages;i++){
    if (i===1||i===pages||(i>=cur-1&&i<=cur+1)) h += '<button class="'+(i===cur?'on':'')+'" onclick="'+fn+'('+i+')">'+i+'</button>';
    else if (i===cur-2||i===cur+2) h += '<span>…</span>';
  }
  return h + '<button onclick="'+fn+'('+(cur+1)+')" '+(cur===pages?'disabled':'')+'>›</button><span>'+total+' '+noun+'</span></div>';
}
var ordPage = 1, ordList = [], ORD_PAGE = 15;
function goOrdPage(p){ var pages = Math.ceil(ordList.length/ORD_PAGE); if (p<1||p>pages) return; ordPage = p; drawOrders(); window.scrollTo({top:0,behavior:'smooth'}); }
function renderTable(list) { ordList = list; ordPage = 1; drawOrders(); }
function drawOrders() {
  const body = document.getElementById('ordersBody');
  const pages = Math.max(1, Math.ceil(ordList.length/ORD_PAGE));
  if (ordPage > pages) ordPage = pages;
  const page = ordList.slice((ordPage-1)*ORD_PAGE, ordPage*ORD_PAGE);
  document.getElementById('pagination').innerHTML = adPager(ordPage, pages, ordList.length, 'goOrdPage', 'pedidos');
  if (!page.length) { body.innerHTML = '<div class="ad-empty">Sin resultados</div>'; return; }
  body.innerHTML = page.map(o => `
    <div class="ad-row" style="cursor:default">
      <div class="ad-av" title="${adTypeLabel(o.delivery_type)}">${adTypeIcon(o.delivery_type)}</div>
      <div class="ad-main">
        <div class="ad-t"><span class="ad-name">${APP.esc(o.client_name||'Cliente')}</span></div>
        <div class="ad-s"><b>${APP.esc(o.business_name||'')}</b> · #${APP.esc(String(o.order_number||'').replace(/^PED-/,''))}</div>
        <div class="ad-s">${adShortDate(o.created_at)} · Tarifa <b style="color:#15803d">+${APP.money(o.service_fee)}</b>${parseFloat(o.delivery_fee)>0?' · Envío '+APP.money(o.delivery_fee):''}</div>
      </div>
      <div class="ad-r">
        <div class="ad-amt">${APP.money(o.total)}</div>
        <span class="ad-st s-${o.status}">${(APP.statusLabel[o.status]||o.status).replace(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ]+/,'')}</span>
        <div class="ad-acts">
          ${o.delivery_type==='delivery' && !['entregado','cancelado'].includes(o.status) ? `<button class="ad-ib warn" onclick="releaseDelivery(${o.id})" title="Liberar repartidor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>` : ''}
          <button class="ad-ib danger" onclick="deleteOrder(${o.id},'${(o.order_number||'').replace(/'/g,'')}')" title="Eliminar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
        </div>
      </div>
    </div>
  `).join('');
}

async function releaseDelivery(orderId) {
  if (!confirm('¿Liberar el repartidor? El pedido quedará disponible de nuevo.')) return;
  // Find delivery by order_id
  var res = await fetch('/api/admin/orders', {
    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('nuevaexpress_token') }
  }).then(r=>r.json());
  // Get deliveries
  var dRes = await fetch('/api/deliveries', {
    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('nuevaexpress_token') }
  }).then(r=>r.json());
  var all = (dRes.data?.available||[]).concat(dRes.data?.mine||[]);
  var d = all.find(function(x){ return x.order_id == orderId; });
  if (!d) { APP.toast('No se encontró la entrega','error'); return; }
  var r2 = await fetch('/api/deliveries/'+d.id+'/release', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('nuevaexpress_token')},
    body:JSON.stringify({})
  }).then(r=>r.json());
  if (r2.success) { APP.toast('Pedido liberado — disponible para repartidores'); init(); }
  else APP.toast(r2.message||'Error','error');
}

async function deleteOrder(id, num) {
  if (!confirm('¿Eliminar el pedido ' + num + '? Se eliminará del historial del negocio y del cliente.')) return;
  var res = await fetch('/api/admin/orders/' + id, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('nuevaexpress_token') }
  }).then(function(r){ return r.json(); });
  if (res.success) { APP.toast('Pedido eliminado'); init(); }
  else APP.toast(res.message || 'Error', 'error');
}

init();
setInterval(init, 30000);
</script>

<script>
function toggleSidebar() {
  var sidebar = document.querySelector('.sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  if (sidebar) sidebar.classList.toggle('open');
  if (overlay) overlay.classList.toggle('open');
}
</script>

<script src="/assets/js/pwa.js?v=202610222210"></script>
</body>
</html>
