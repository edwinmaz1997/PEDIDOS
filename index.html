<script>
const API = '/api';



// ─── State ───────────────────────────────────────────────
let categories = [];
let activeCategory = null;

// ─── Init ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  // Update navbar based on auth state
  var token = localStorage.getItem('nuevaexpress_token');
  var user  = JSON.parse(localStorage.getItem('nuevaexpress_user') || '{}');
  var navRight = document.getElementById('navRight');
  if (token && user.name && navRight) {
    var role  = user.role || 'cliente';
    var panel = role === 'admin' ? '/admin/index.html' : (role === 'negocio' ? '/negocio/index.html' : (role === 'repartidor' ? '/repartidor/index.html' : '/cliente/index.html'));
    var first = escHtml(user.name.split(' ')[0]);
    navRight.innerHTML =
      '<a href="' + panel + '" class="h-me"><span class="h-me-av">' + first.charAt(0).toUpperCase() + '</span><span class="h-me-t"><small>Hola,</small>' + first + '</span></a>';
  }
  await loadCategories();
  await filterCategory(null, null);
});

// ─── Load Categories ──────────────────────────────────────
async function loadCategories() {
  try {
    const res = await fetch(`${API}/categories`);
    const data = await res.json();
    categories = data.data || [];
    renderCategories();
  } catch(e) { console.error(e); }
}

var CAT_ICONS = {
  utensils:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  pills:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  'shopping-cart':'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  shirt:'<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>',
  laptop:'<path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/>',
  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  store:'<path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/><path d="M10 21v-5h4v5"/>',
  all:'<rect width="7" height="7" x="3" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="14" rx="1.5"/><rect width="7" height="7" x="3" y="14" rx="1.5"/>'
};
function catSvg(k){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(CAT_ICONS[k]||CAT_ICONS.store)+'</svg>'; }
function catBtn(c, extra) {
  var id = c ? c.id : null;
  var color = c && c.color ? escHtml(c.color) : '#4A90D9';
  return '<button class="cat-chip h-cat'+(id===activeCategory?' active':'')+'" data-cat="'+(id===null?'':id)+'" onclick="filterCategory('+id+', this)'+(extra||'')+'" style="--cat-color:'+color+'">' +
    '<span class="h-cat-ic">'+catSvg(c ? c.icon : 'all')+'</span><span class="h-cat-t">'+(c ? escHtml(c.name) : 'Todos')+'</span></button>';
}
function renderCategories() {
  document.getElementById('categoriesTrack').innerHTML = catBtn(null) + categories.map(function(c){ return catBtn(c); }).join('');
  var grid = document.getElementById('allCatsGrid');
  if (grid) grid.innerHTML = catBtn(null, ';closeCatsPanel()') + categories.map(function(c){ return catBtn(c, ';closeCatsPanel()'); }).join('');
}

// ─── Filter by category ───────────────────────────────────
async function filterCategory(id, btn) {
  activeCategory = id;
  document.querySelectorAll('.cat-chip').forEach(b => b.classList.toggle('active', (b.dataset.cat || null) == (id === null ? null : String(id))));
  var _ab = document.querySelector('#categoriesTrack .cat-chip.active');
  if (_ab && id !== null && _ab.scrollIntoView) _ab.scrollIntoView({ inline:'nearest', block:'nearest', behavior:'smooth' });
  document.getElementById('searchResults').classList.add('hidden');

  if (!id) {
    // Todos — carrusel con todos los negocios
    document.getElementById('businessSections').classList.remove('hidden');
    document.getElementById('categoryResults').classList.add('hidden');
    document.getElementById('businessSections').innerHTML = skeletonGrid();
    try {
      const res  = await fetch(`${API}/businesses?limit=100`);
      const data = await res.json();
      const all  = data.data?.businesses || [];
      if (!all.length) {
        document.getElementById('businessSections').innerHTML = emptyHome('Aún no hay negocios registrados.');
        return;
      }
      const featured = all.filter(b => parseInt(b.is_featured));
      const sorted = all.slice().sort((a, b) => (isBusinessOpen(b) === false ? 0 : 1) - (isBusinessOpen(a) === false ? 0 : 1));
      const openNow = all.filter(b => isBusinessOpen(b) === true && !parseInt(b.is_featured));
      document.getElementById('businessSections').innerHTML = `
        ${featured.length ? `
        <section class="h-sec">
          <div class="h-sec-head"><h2>Destacados</h2></div>
          <div class="h-feat">${featured.map(b => renderFeatured(b)).join('')}</div>
        </section>` : ''}
        ${openNow.length ? `
        <section class="h-sec">
          <div class="h-sec-head"><h2>Abiertos ahora</h2><span class="h-count">${openNow.length}</span></div>
          <div class="h-row">${openNow.slice(0, 10).map(b => renderCard(b)).join('')}</div>
        </section>` : ''}
        <section class="h-sec">
          <button type="button" class="h-all-btn" onclick="toggleAllBiz(this)" aria-expanded="false">
            <span class="h-all-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/><path d="M10 21v-5h4v5"/></svg></span>
            <span class="h-all-t"><strong>Ver todos los negocios</strong><small>${all.length} negocio${all.length !== 1 ? 's' : ''} en NuevaExpress</small></span>
            <svg class="h-all-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="h-all-list" id="allBizList" hidden>${sorted.map(b => renderRow(b)).join('')}</div>
        </section>`;
    } catch(e) {
      document.getElementById('businessSections').innerHTML = emptyHome('No pudimos cargar los negocios. Revisa tu conexión.');
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  // Filtrar por categoría — fetch dedicado
  document.getElementById('businessSections').classList.add('hidden');
  const catResults = document.getElementById('categoryResults');
  catResults.classList.remove('hidden');
  catResults.innerHTML = '<section class="h-sec">' + skeletonGrid() + '</section>';

  try {
    const res  = await fetch(`${API}/businesses/by-category/${id}`);
    const data = await res.json();
    const businesses = Array.isArray(data.data) ? data.data : (data.data?.businesses || []);

    if (!businesses.length) {
      catResults.innerHTML = '<section class="h-sec">' + emptyHome('Aún no hay negocios en esta categoría.') + '</section>';
      return;
    }

    var _cat = categories.find(c => c.id == id);
    catResults.innerHTML = `
      <section class="h-sec">
        <div class="h-sec-head"><h2>${escHtml(_cat ? _cat.name : 'Negocios')}</h2><span class="h-count">${businesses.length}</span></div>
        <div class="h-grid">${businesses.map(b => renderCard(b)).join('')}</div>
      </section>`;
  } catch(e) {
    catResults.innerHTML = '<section class="h-sec">' + emptyHome('No pudimos cargar los negocios.') + '</section>';
  }
}

// ─── Load All Sections (carousel per category) ────────────
async function loadAllSections() {
  const container = document.getElementById('businessSections');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
  try {
    const res = await fetch(`${API}/businesses?limit=50`);
    const data = await res.json();
    const businesses = data.data?.businesses || [];

    // Group by category
    const grouped = {};
    businesses.forEach(b => {
      const key = b.category_id;
      if (!grouped[key]) grouped[key] = { name: b.category_name, icon: b.category_icon, color: b.category_color, items: [] };
      grouped[key].items.push(b);
    });

    if (Object.keys(grouped).length === 0) {
      container.innerHTML = '<div class="empty-state"><p>No hay negocios registrados aún.</p></div>';
      return;
    }

    container.innerHTML = Object.entries(grouped).map(([catId, group]) => `
      <section class="biz-section" id="cat-section-${catId}">
        <div class="container">
          <div class="section-header">
            <h2 class="section-title">${escHtml(group.name)}</h2>
            <span class="see-all" onclick="filterCategory(${catId}, document.querySelector('[onclick*=\\'filterCategory(${catId}\\']'))">Ver todos →</span>
          </div>
          <div class="carousel-wrapper">
            <button class="carousel-btn prev" onclick="slideCarousel('${catId}', -1)">‹</button>
            <div class="carousel-track" id="carousel-${catId}">
              ${group.items.map(b => renderCard(b)).join('')}
            </div>
            <button class="carousel-btn next" onclick="slideCarousel('${catId}', 1)">›</button>
          </div>
        </div>
      </section>
    `).join('');
  } catch(e) {
    container.innerHTML = '<div class="empty-state"><p>Error cargando negocios.</p></div>';
    console.error(e);
  }
}

// ─── Carousel ─────────────────────────────────────────────
function slideCarousel(catId, dir) {
  const track = document.getElementById(`carousel-${catId}`);
  const cardW = track.querySelector('.biz-card')?.offsetWidth + 24 || 320;
  track.scrollBy({ left: dir * cardW * 2, behavior: 'smooth' });
}

// ─── Render Card ──────────────────────────────────────────
function isBusinessOpen(business) {
  try {
    var hours = {};
    if (business.opening_hours) {
      hours = typeof business.opening_hours === 'string' ? JSON.parse(business.opening_hours) : business.opening_hours;
    }
    if (!hours || !Object.keys(hours).length) return null; // sin horario configurado
    var dayKeys = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
    var now = new Date();
    var dayKey = dayKeys[now.getDay()];
    var h = hours[dayKey];
    var cur = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    if (h && h.closed) return false;
    if (h && h.open && h.close) return !(cur < h.open || cur > h.close);
    return null;
  } catch(e) { return null; }
}

function bizLogo(b, cls) {
  var ini = escHtml(String(b.name||'N').trim().charAt(0).toUpperCase());
  return '<div class="'+cls+'">'+(b.logo ? '<img src="'+escHtml(b.logo)+'" alt="" loading="lazy" onerror="this.parentNode.textContent=\''+ini+'\'">' : ini)+'</div>';
}
function bizBadges(b) {
  var open = isBusinessOpen(b);
  var html = '';
  if (open !== null) html += '<span class="h-st '+(open?'on':'off')+'">'+(open?'Abierto':'Cerrado')+'</span>';
  if (b.business_type === 'delivery' || b.accepts_delivery) html += '<span class="h-dl" title="Delivery"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>'+(b.business_type === 'delivery' ? 'Solo delivery' : 'Delivery')+'</span>';
  return html;
}
function renderCard(b) {
  const photo = b.photos?.[0]?.photo_url || b.cover_photo || '';
  const open = isBusinessOpen(b);
  return `
    <article class="h-card${open === false ? ' is-closed' : ''}" onclick="goBusiness(${b.id}, '${escHtml(b.business_type || '')}')">
      <div class="h-card-ph" ${photo ? `style="background-image:url('${escHtml(photo)}')"` : ''}>
        ${photo ? '' : `<span class="h-card-ph-ini">${escHtml(String(b.name||'N').charAt(0).toUpperCase())}</span>`}
        <div class="h-card-badges">${bizBadges(b)}</div>

// ─── Search ───────────────────────────────────────────────
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { if (e.target.value.trim()) doSearch(); else showAll(); }, 400);
});
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); clearTimeout(searchTimeout); doSearch(); e.target.blur(); }
});

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return showAll();
  try {
    const res = await fetch(`${API}/businesses/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const results = data.data || [];
    document.getElementById('businessSections').classList.add('hidden');
    document.getElementById('categoryResults').classList.add('hidden');
    const sr = document.getElementById('searchResults');
    sr.classList.remove('hidden');
    document.getElementById('searchTitle').textContent = `${results.length} resultado${results.length !== 1 ? 's' : ''} para "${q}"`;
    document.getElementById('resultsGrid').innerHTML = results.length
      ? results.map(b => renderCard(b)).join('')
      : emptyHome('Sin resultados. Prueba con otra palabra.');
  } catch(e) { console.error(e); }
}

function showAll() {
  document.getElementById('searchResults').classList.add('hidden');
  // Restaurar la vista según la categoría activa (no siempre "Todos")
  if (activeCategory) {
    document.getElementById('categoryResults').classList.remove('hidden');
    document.getElementById('businessSections').classList.add('hidden');
  } else {
    document.getElementById('businessSections').classList.remove('hidden');
    document.getElementById('categoryResults').classList.add('hidden');
  }
}

// ── Slider de fotos del modal ─────────────────────────────
var _sliderIdx = 0;
var _sliderTimer = null;
var _sliderTotal = 0;

function sliderGo(e, idx) {
  if (e) e.stopPropagation();
  var track = document.getElementById('photoSlider');
  if (!track) return;
  _sliderTotal = track.children.length;
  _sliderIdx = ((idx % _sliderTotal) + _sliderTotal) % _sliderTotal;
  var w = track.offsetWidth;
  track.scrollTo({ left: _sliderIdx * w, behavior: 'smooth' });
  document.querySelectorAll('.slider-dot').forEach(function(d, i){ d.classList.toggle('active', i === _sliderIdx); });
}
function sliderNext(e) { if (e) e.stopPropagation(); sliderGo(null, _sliderIdx + 1); }
function sliderPrev(e) { if (e) e.stopPropagation(); sliderGo(null, _sliderIdx - 1); }

function startSliderAuto() {
  clearInterval(_sliderTimer);
  var track = document.getElementById('photoSlider');
  if (!track || track.children.length < 2) return;
  _sliderTotal = track.children.length;
  _sliderTimer = setInterval(function(){ sliderNext(null); }, 2000);
}
function stopSliderAuto() { clearInterval(_sliderTimer); }

var _lightboxPhotos = [];
var _lightboxCurrent = 0;

function openLightbox(src) {
  stopSliderAuto();
  // Recopilar todas las fotos del slider actual
  var track = document.getElementById('photoSlider');
  var sliderPhotos = track ? Array.from(track.children).map(function(img){ return img.src; }) : [];
  var idxInSlider = sliderPhotos.indexOf(src);

  if (idxInSlider >= 0) {
    // La foto pertenece al slider del negocio — mostrar con navegación
    _lightboxPhotos = sliderPhotos;
    _lightboxCurrent = idxInSlider;
  } else {
    // Es una foto independiente (servicio, producto, etc.) — mostrar solo esa
    _lightboxPhotos = [src];
    _lightboxCurrent = 0;
  }

  showLightboxImage();
  document.getElementById('lightbox').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function showLightboxImage() {
  document.getElementById('lightboxImg').src = _lightboxPhotos[_lightboxCurrent];
  var counter = document.getElementById('lightboxCounter');
  if (_lightboxPhotos.length > 1) {
    counter.textContent = (_lightboxCurrent + 1) + ' / ' + _lightboxPhotos.length;
  } else {
    counter.textContent = '';
  }
  // Mostrar/ocultar flechas si solo hay 1 foto
  var btns = document.querySelectorAll('#lightbox button');
  // El primer y segundo botón son las flechas (prev/next)
}

function lightboxPrev() {
  _lightboxCurrent = ((_lightboxCurrent - 1) + _lightboxPhotos.length) % _lightboxPhotos.length;
  showLightboxImage();
}

function lightboxNext() {
  _lightboxCurrent = (_lightboxCurrent + 1) % _lightboxPhotos.length;
  showLightboxImage();
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.body.style.overflow = '';
  startSliderAuto();
}

      el.innerHTML = svcs.map(s => {
        var price = '';
        if (s.price_from && s.price_to) price = `<span style="color:var(--accent);font-weight:700;font-size:.85rem">Q${parseFloat(s.price_from).toFixed(0)} – Q${parseFloat(s.price_to).toFixed(0)}</span>`;
        else if (s.price_from) price = `<span style="color:var(--accent);font-weight:700;font-size:.85rem">Desde Q${parseFloat(s.price_from).toFixed(0)}</span>`;
        return `<div style="padding:12px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;gap:12px;align-items:flex-start">
            ${s.photo_url ? `<img src="${escHtml(s.photo_url)}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0;cursor:zoom-in" onclick="openLightbox('${escHtml(s.photo_url)}')">` : ''}
            <div style="flex:1;min-width:0">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
                <div style="font-weight:600">${escHtml(s.name)}</div>
                ${price}
              </div>
              ${s.description ? `<div style="font-size:.82rem;color:var(--muted);margin-top:2px">${escHtml(s.description)}</div>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }
  } catch(e) {}
}

function closeModal() {
  stopSliderAuto();
  document.getElementById('businessModal').classList.add('hidden');
  document.body.style.overflow = '';
}
document.getElementById('businessModal').addEventListener('click', (e) => {
  if (e.target.id === 'businessModal') closeModal();
});

// ─── Utils ────────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

var _catTimer = null;
var _bizScrollTimer = null;

function startBizCarouselScroll(trackId) {
  clearInterval(_bizScrollTimer);
  var t = document.getElementById(trackId);
  if (!t) return;
  var resetting = false;
  _bizScrollTimer = setInterval(function() {
    if (resetting) return;
    var max = t.scrollWidth - t.clientWidth;
    if (max <= 0) return;
    if (t.scrollLeft >= max - 1) {
      resetting = true;
      t.scrollLeft = 0;
      setTimeout(function(){ resetting = false; }, 800);
    } else {
      t.scrollLeft += 1;
    }
  }, 20);
  t.addEventListener('mouseenter', function(){ clearInterval(_bizScrollTimer); });
  t.addEventListener('mouseleave', function(){ startBizCarouselScroll(trackId); });
  t.addEventListener('touchstart', function(){ clearInterval(_bizScrollTimer); }, {passive:true});
  t.addEventListener('touchend', function(){ setTimeout(function(){ startBizCarouselScroll(trackId); }, 2500); }, {passive:true});
}
function initCatCarousel() { return; // desplazamiento automático desactivado

  var t = document.getElementById('categoriesTrack');
  if (!t) return;
  clearInterval(_catTimer);
  var resetting = false;

  function step() {
    if (resetting) return;
    var max = t.scrollWidth - t.clientWidth;
    if (max <= 0) return;
    if (t.scrollLeft >= max - 1) {
      resetting = true;
      t.scrollLeft = 0;
      setTimeout(function(){ resetting = false; }, 800);
    } else {
      t.scrollLeft += 1;
    }
  }

  _catTimer = setInterval(step, 20);
  t.addEventListener('mouseenter', function(){ clearInterval(_catTimer); });
  t.addEventListener('mouseleave', function(){ _catTimer = setInterval(step, 20); });
  t.addEventListener('touchstart', function(){ clearInterval(_catTimer); }, {passive:true});
  t.addEventListener('touchend', function(){ setTimeout(function(){ _catTimer = setInterval(step, 20); }, 2500); }, {passive:true});
}
setTimeout(initCatCarousel, 1500);
(function(){
  var phrases=["cerca de ti","en tu bolsillo","a tu puerta","en minutos"];
  var el=document.getElementById("typedText");
  var pi=0,ci=0,deleting=false;
  if(!el)return;
  function type(){
    var phrase=phrases[pi];
    if(!deleting){
      el.textContent=phrase.slice(0,++ci);
      if(ci===phrase.length){deleting=true;setTimeout(type,1800);return;}
      setTimeout(type,80);
    } else {
      el.textContent=phrase.slice(0,--ci);
      if(ci===0){deleting=false;pi=(pi+1)%phrases.length;setTimeout(type,400);return;}
      setTimeout(type,45);
    }
  }
  setTimeout(type,600);
})();
</script>
