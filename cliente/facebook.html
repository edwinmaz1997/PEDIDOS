<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Facebook — NuevaExpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#f0f2f5; min-height:100dvh; padding-bottom:70px; }

.fb-header {
  background:#1877F2;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.fb-logo { width:36px;height:36px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem;color:#1877F2;flex-shrink:0; }
.fb-title { color:white;font-weight:700;font-size:1rem;flex:1; }
.fb-open-btn {
  background:white;color:#1877F2;font-size:.8rem;font-weight:700;
  padding:7px 14px;border-radius:20px;text-decoration:none;flex-shrink:0;
}

.fb-embed-wrap {
  width:100%;
  overflow-y:auto;
  background:white;
  -webkit-overflow-scrolling:touch;
  padding-top:8px;
}

/* Bottom Nav */
.bnav {
  position:fixed;bottom:0;left:0;right:0;
  background:white;border-top:1px solid #e5e7eb;
  z-index:1000;display:flex;align-items:stretch;
  box-shadow:0 -2px 12px rgba(0,0,0,.08);
  height:60px;padding-bottom:env(safe-area-inset-bottom);
}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#6b7280;font-size:.65rem;font-weight:500;gap:2px;padding:6px 0}
.bnav-icon{font-size:1.3rem;line-height:1}
.bnav-label{line-height:1}
.bnav-item.active{color:#3b82f6}
.bnav-center .bnav-icon{background:#3b82f6;color:white;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-top:-16px;box-shadow:0 4px 12px rgba(59,130,246,.4)}
</style>
</head>
<body>

<div class="fb-header">
  <div class="fb-logo">f</div>
  <span class="fb-title">NuevaExpress GT</span>
  <a href="https://www.facebook.com/NuevaExpressGT" target="_blank" rel="noopener" class="fb-open-btn">Ver en Facebook</a>
</div>

<div class="fb-embed-wrap" id="fbWrap">
  <div id="fb-root"></div>
  <div
    class="fb-page"
    id="fbPage"
    data-href="https://www.facebook.com/NuevaExpressGT"
    data-tabs="timeline"
    data-small-header="true"
    data-adapt-container-width="true"
    data-hide-cover="false"
    data-show-facepile="false">
  </div>
</div>

<nav class="bnav">
  <a href="/cliente/index.html" class="bnav-item">
    <span class="bnav-icon">📋</span>
    <span class="bnav-label">Pedidos</span>
  </a>
  <a href="/cliente/promociones.html" class="bnav-item">
    <span class="bnav-icon">🏷️</span>
    <span class="bnav-label">Promos</span>
  </a>
  <a href="/index.html" class="bnav-item bnav-center">
    <span class="bnav-icon">🏠</span>
    <span class="bnav-label">Inicio</span>
  </a>
  <a href="/cliente/facebook.html" class="bnav-item active">
    <span class="bnav-icon" style="font-size:1rem;font-weight:900;background:#1877F2;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center">f</span>
    <span class="bnav-label">Facebook</span>
  </a>
  <a href="/cliente/anuncios.html" class="bnav-item">
    <span class="bnav-icon">📢</span>
    <span class="bnav-label">Anuncios</span>
  </a>
</nav>

<script>
window.fbAsyncInit = function() {
  FB.init({ appId: '1626396929202423', xfbml: false, version: 'v19.0' });
  // Set width and parse
  var w = Math.min(window.innerWidth, 500);
  var fbPage = document.getElementById('fbPage');
  fbPage.setAttribute('data-width', w);
  fbPage.setAttribute('data-height', window.innerHeight - 70);
  document.getElementById('fbWrap').style.height = (window.innerHeight - 70) + 'px';
  FB.XFBML.parse();
};
(function(d, s, id){
  var js, fjs = d.getElementsByTagName(s)[0];
  if (d.getElementById(id)) return;
  js = d.createElement(s); js.id = id;
  js.src = 'https://connect.facebook.net/es_LA/sdk.js';
  fjs.parentNode.insertBefore(js, fjs);
}(document, 'script', 'facebook-jssdk'));
</script>
</body>
</html>
