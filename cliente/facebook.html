<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Facebook — NuevaExpress</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:#f0f2f5; overflow:hidden; }
body { display:flex; flex-direction:column; }
#fbWrap {
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:8px 0 70px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.bnav {
  position:fixed;bottom:0;left:0;right:0;
  background:white;border-top:1px solid #e5e7eb;
  z-index:1000;display:flex;align-items:stretch;
  box-shadow:0 -2px 12px rgba(0,0,0,.08);
  height:60px;padding-bottom:env(safe-area-inset-bottom);
}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#6b7280;font-size:.65rem;font-weight:500;gap:2px;padding:6px 0}
.bnav-icon{font-size:1.3rem;line-height:1}
.bnav-label{line-height:1}
.bnav-item.active{color:#3b82f6}
.bnav-center .bnav-icon{background:#3b82f6;color:white;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-top:-16px;box-shadow:0 4px 12px rgba(59,130,246,.4)}
</style>
</head>
<body>

<div id="fbWrap">
  <div id="fb-root"></div>
  <div
    class="fb-page"
    data-href="https://www.facebook.com/NuevaExpressGT"
    data-tabs="timeline"
    data-width="500"
    data-height="700"
    data-small-header="false"
    data-adapt-container-width="true"
    data-hide-cover="false"
    data-show-facepile="true">
  </div>
</div>

<nav class="bnav">
  <a href="/cliente/index.html" class="bnav-item">
    <span class="bnav-icon">📋</span>
    <span class="bnav-label">Pedidos</span>
  </a>
  <a href="/cliente/promociones.html" class="bnav-item">
    <span class="bnav-icon">🏷️</span>
    <span class="bnav-label">Promos</span>
  </a>
  <a href="/index.html" class="bnav-item bnav-center">
    <span class="bnav-icon">🏠</span>
    <span class="bnav-label">Inicio</span>
  </a>
  <a href="/cliente/facebook.html" class="bnav-item active">
    <span class="bnav-icon" style="font-size:1rem;font-weight:900;background:#1877F2;color:white;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center">f</span>
    <span class="bnav-label">Facebook</span>
  </a>
  <a href="/cliente/anuncios.html" class="bnav-item">
    <span class="bnav-icon">📢</span>
    <span class="bnav-label">Anuncios</span>
  </a>
</nav>

<div id="fb-root"></div>
<script async defer crossorigin="anonymous"
  src="https://connect.facebook.net/es_LA/sdk.js#xfbml=1&version=v19.0&appId=1626396929202423">
</script>
</body>
</html>
