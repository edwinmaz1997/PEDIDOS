<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook — NuevaExpress</title>
<link rel="stylesheet" href="/assets/css/main.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1877F2; height:100dvh; display:flex; flex-direction:column; padding-bottom:60px; }
  .fb-header {
    background:#1877F2;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
    flex-shrink:0;
  }
  .fb-logo { width:32px;height:32px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;color:#1877F2; }
  .fb-title { font-weight:700;font-size:1rem; }
  .fb-frame-wrap { flex:1; overflow-y:auto; background:white; }
  .fb-page { width:100% !important; }
</style>
</head>
<body>
<div class="fb-header">
  <div class="fb-logo">f</div>
  <span class="fb-title">NuevaExpress GT</span>
  <a href="https://www.facebook.com/NuevaExpressGT" target="_blank" rel="noopener"
    style="margin-left:auto;background:white;color:#1877F2;font-size:.8rem;font-weight:700;padding:6px 14px;border-radius:20px;text-decoration:none">
    Abrir
  </a>
</div>
<div class="fb-frame-wrap" id="fbWrap">
  <div id="fb-root"></div>
  <div class="fb-page"
    data-href="https://www.facebook.com/NuevaExpressGT"
    data-tabs="timeline"
    data-width=""
    data-height=""
    data-small-header="true"
    data-adapt-container-width="true"
    data-hide-cover="false"
    data-show-facepile="false">
  </div>
</div>
<script>
window.fbAsyncInit = function() {
  FB.init({ appId: '1626396929202423', xfbml: true, version: 'v19.0' });
};
(function(d, s, id){
  var js, fjs = d.getElementsByTagName(s)[0];
  if (d.getElementById(id)) return;
  js = d.createElement(s); js.id = id;
  js.src = "https://connect.facebook.net/es_LA/sdk.js";
  fjs.parentNode.insertBefore(js, fjs);
}(document, 'script', 'facebook-jssdk'));
</script>
