<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4A90D9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NuevaExpress">
<link rel="apple-touch-icon" href="/assets/img/logo.jpg">
<link rel="icon" type="image/jpeg" href="/assets/img/logo.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Olvidé mi contraseña — NuevaExpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css?v=202610222210">
<link rel="stylesheet" href="/assets/css/auth.css?v=202610230015">
<style>
body{background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.auth-card{background:white;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.auth-logo{font-family:'Plus Jakarta Sans',system-ui,'Segoe UI',Roboto,sans-serif;font-size:1.6rem;font-weight:800;margin-bottom:24px}
.auth-logo span{color:var(--accent)}
.success-box{background:#d4edda;border:1px solid #c3e6cb;border-radius:var(--radius-sm);padding:16px;font-size:.9rem;color:#155724;display:none}
</style>
</head>
<body class="auth">
<header class="a-top"><a href="/" class="a-back" aria-label="Volver al inicio"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a><a href="login.html" class="a-top-link">Iniciar sesión</a></header>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="a-head">
      <div class="a-logo"><img src="/assets/img/logo.jpg" alt="NuevaExpress"></div>
      <h1>¿Olvidaste tu contraseña?</h1>
      <p>Escribe tu correo y te enviaremos un enlace para crear una nueva.</p>
    </div>
    <div class="success-box" id="successBox">Revisa tu correo. Si existe una cuenta con ese email, recibirás las instrucciones en unos minutos.</div>
    <div id="formWrap">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="tucorreo@ejemplo.com" autocomplete="email">
      </div>
      <div id="errorMsg" style="color:#b91c1c;font-size:.85rem;font-weight:600;margin-bottom:12px;display:none"></div>
      <button class="btn-primary" onclick="send()" id="sendBtn">Enviar enlace</button>
    </div>
    <div class="a-links"><a href="login.html">Volver a iniciar sesión</a></div>
  </div>
</div>
<script>
async function send() {
  const email = document.getElementById('email').value.trim();
  const btn   = document.getElementById('sendBtn');
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';
  if (!email) { errEl.textContent = 'Ingresa tu correo'; errEl.style.display = 'block'; return; }
  btn.textContent = 'Enviando...'; btn.disabled = true;
  try {
    const res  = await fetch('/api/auth/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email}) });
    const data = await res.json();
    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
  } catch(e) {
    errEl.textContent = 'Error de conexión. Intenta de nuevo.';
    errEl.style.display = 'block';
    btn.textContent = 'Enviar enlace'; btn.disabled = false;
  }
}
document.addEventListener('keydown', e => { if(e.key==='Enter') send(); });
</script>
<script src="/assets/js/pwa.js?v=202610231000"></script>
</body>
</html>
